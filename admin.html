        function safeParse(json) {
            try { return JSON.parse(json); } catch { return null; }
        }

        function applySiteDataMerge(defaults, parsed) {
            if (!parsed || typeof parsed !== 'object') return defaults;
            return {
                ...defaults,
                ...parsed,
                info: { ...defaults.info, ...(parsed.info || {}) },
                hero: { ...defaults.hero, ...(parsed.hero || {}) },
                about: { ...defaults.about, ...(parsed.about || {}) },
                services: Array.isArray(parsed.services) ? parsed.services : defaults.services,
                products: Array.isArray(parsed.products) ? parsed.products : defaults.products,
                projects: Array.isArray(parsed.projects) ? parsed.projects : defaults.projects
            };
        }

        function loadSiteData() {
            const raw = localStorage.getItem(STORAGE_KEY);
            const parsed = raw ? safeParse(raw) : null;
            if (!parsed || typeof parsed !== 'object') return DEFAULT_SITE_DATA;
            return applySiteDataMerge(DEFAULT_SITE_DATA, parsed);
        }

        async function fetchRemoteSiteData() {
            try {
                const base = new URL(SITE_DATA_FILE, window.location.href).href;
                const url = base + (base.includes('?') ? '&' : '?') + '_=' + Date.now();
                const r = await fetch(url, { cache: 'no-store' });
                if (!r.ok) return null;
                return applySiteDataMerge(DEFAULT_SITE_DATA, await r.json());
            } catch {
                return null;
            }
        }

        function saveSiteData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function downloadSiteDataJsonFile(data) {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = SITE_DATA_FILE;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 2000);
        }

        function uid(prefix) {
            return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
        }

        /** Resize and encode as JPEG so localStorage stays within browser limits */
        function embedLocalImageFile(file, onDone, onErr) {
            if (!file || !file.type.startsWith('image/')) {
                onErr(new Error('Please choose an image file.'));
                return;
            }
            const reader = new FileReader();
            reader.onload = () => {
                const img = new Image();
                img.onload = () => {
                    const maxSide = 1920;
                    let w = img.naturalWidth;
                    let h = img.naturalHeight;
                    if (!w || !h) {
                        onErr(new Error('Could not read image dimensions.'));
                        return;
                    }
                    if (w > maxSide || h > maxSide) {
                        if (w >= h) {
                            h = Math.round((h * maxSide) / w);
                            w = maxSide;
                        } else {
                            w = Math.round((w * maxSide) / h);
                            h = maxSide;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    let dataUrl;
                    try {
                        dataUrl = canvas.toDataURL('image/jpeg', 0.86);
                    } catch (e) {
                        onErr(new Error('Could not process image (try JPG or PNG).'));
                        return;
                    }
                    onDone(dataUrl);
                };
                img.onerror = () => onErr(new Error('Invalid image file.'));
                img.src = reader.result;
            };
            reader.onerror = () => onErr(new Error('Could not read file.'));
            reader.readAsDataURL(file);
        }

        function ImageField({ label, value, onChange }) {
            const fileRef = useRef(null);
            const [busy, setBusy] = useState(false);
            const isEmbedded = typeof value === 'string' && value.startsWith('data:image');

            function onFileChange(e) {
                const file = e.target.files && e.target.files[0];
                e.target.value = '';
                if (!file) return;
                setBusy(true);
                embedLocalImageFile(
                    file,
                    (dataUrl) => {
                        onChange(dataUrl);
                        setBusy(false);
                    },
                    (err) => {
                        setBusy(false);
                        alert(err.message || 'Upload failed');
                    }
                );
            }

            const approxKb = isEmbedded ? Math.round(value.length / 1024) : 0;

            return (
                <div>
                    <label className="text-xs font-black text-slate-400 uppercase">{label}</label>
                    <input
                        type="text"
                        className="w-full p-4 mt-2 border rounded-2xl bg-slate-50 outline-none focus:border-blue-500"
                        value={isEmbedded ? '' : (value ?? '')}
                        placeholder={
                            isEmbedded
                                ? 'Using a photo from your computer (embedded). Paste a URL here to switch, or upload another file.'
                                : 'https://... or use Upload from computer'
                        }
                        onChange={(e) => onChange(e.target.value)}
                    />
                    <div className="flex flex-wrap items-center gap-3 mt-3">
                        <label className="inline-flex items-center justify-center px-5 py-3 rounded-2xl bg-blue-900 text-white font-black text-sm cursor-pointer hover:bg-blue-800 transition-all disabled:opacity-50">
                            <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={onFileChange} disabled={busy} />
                            {busy ? 'Processing…' : 'Upload from computer'}
                        </label>
                        {(value || isEmbedded) ? (
                            <button
                                type="button"
                                onClick={() => onChange('')}
                                className="px-5 py-3 rounded-2xl border-2 border-slate-200 font-black text-sm text-slate-600 hover:bg-slate-50"
                            >
                                Clear image
                            </button>
                        ) : null}
                        {isEmbedded ? (
                            <span className="text-xs font-bold text-emerald-700">Embedded in browser storage (~{approxKb} KB)</span>
                        ) : null}
                    </div>
                    {value ? (
                        <div className="mt-4 rounded-2xl border border-slate-200 overflow-hidden bg-slate-100 max-w-xs">
                            <img src={value} alt="" className="w-full h-32 object-cover object-center" />
                        </div>
                    ) : null}
                    <p className="text-[11px] text-slate-500 font-semibold mt-3 leading-relaxed">
                        Local photos are saved inside this browser (with your site data) when you click Save. They work on <code className="text-slate-700">index.html</code> on the same computer and browser. For a live public website, upload images to your host and paste the URL instead—very large galleries may exceed storage limits.
                    </p>
                </div>
            );
        }

        function AdminPanel() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [pass, setPass] = useState('');
            const [activeTab, setActiveTab] = useState('info');
            const [siteData, setSiteData] = useState(() => loadSiteData());
            const [savedAt, setSavedAt] = useState('');
            /** Which list item (by id) has its editor expanded — services / products / projects only */
            const [expandedItemId, setExpandedItemId] = useState(null);
            const importJsonRef = useRef(null);

            useEffect(() => {
                // keep admin in sync if homepage or another tab updates storage
                function onStorage(e) {
                    if (e && e.key && e.key !== STORAGE_KEY) return;
                    setSiteData(loadSiteData());
                }
                window.addEventListener('storage', onStorage);
                return () => window.removeEventListener('storage', onStorage);
            }, []);

            useEffect(() => {
                setExpandedItemId(null);
            }, [activeTab]);

            const [serverPullBusy, setServerPullBusy] = useState(false);

            async function loadFromServerJsonFile() {
                setServerPullBusy(true);
                try {
                    const data = await fetchRemoteSiteData();
                    if (!data) {
                        alert(`No ${SITE_DATA_FILE} found on this host, or the request failed.`);
                        return;
                    }
                    setSiteData(data);
                    saveSiteData(data);
                    setSavedAt(new Date().toLocaleString());
                } finally {
                    setServerPullBusy(false);
                }
            }

            const tabs = useMemo(() => (['info', 'hero', 'about', 'services', 'products', 'projects']), []);

            function update(path, value) {
                setSiteData((prev) => {
                    const next = structuredClone ? structuredClone(prev) : JSON.parse(JSON.stringify(prev));
                    let cur = next;
                    for (let i = 0; i < path.length - 1; i++) cur = cur[path[i]];
                    cur[path[path.length - 1]] = value;
                    return next;
                });
            }

            function updateListItem(listKey, id, patch) {
                setSiteData((prev) => {
                    const next = structuredClone ? structuredClone(prev) : JSON.parse(JSON.stringify(prev));
                    next[listKey] = (next[listKey] || []).map((item) => (item.id === id ? { ...item, ...patch } : item));
                    return next;
                });
            }

            function addListItem(listKey) {
                setSiteData((prev) => {
                    const next = structuredClone ? structuredClone(prev) : JSON.parse(JSON.stringify(prev));
                    const idPrefix = listKey === 'services' ? 'svc' : listKey === 'products' ? 'prd' : 'prj';
                    const base =
                        listKey === 'projects'
                            ? { id: uid(idPrefix), title: '', desc: '', type: '', year: '', image: '' }
                            : { id: uid(idPrefix), title: '', desc: '', image: '' };
                    next[listKey] = [...(next[listKey] || []), base];
                    return next;
                });
            }

            function removeListItem(listKey, id) {
                setSiteData((prev) => {
                    const next = structuredClone ? structuredClone(prev) : JSON.parse(JSON.stringify(prev));
                    next[listKey] = (next[listKey] || []).filter((x) => x.id !== id);
                    return next;
                });
            }

            function reorderList(listKey, fromIndex, toIndex) {
                if (fromIndex === toIndex || Number.isNaN(fromIndex) || Number.isNaN(toIndex)) return;
                setSiteData((prev) => {
                    const next = structuredClone ? structuredClone(prev) : JSON.parse(JSON.stringify(prev));
                    const list = [...(next[listKey] || [])];
                    if (fromIndex < 0 || fromIndex >= list.length || toIndex < 0 || toIndex >= list.length) return prev;
                    const [moved] = list.splice(fromIndex, 1);
                    list.splice(toIndex, 0, moved);
                    next[listKey] = list;
                    return next;
                });
            }

            /** Move one slot up (−1) or down (+1); reorderList handles bounds (including move to top). */
            function moveListItemOneStep(listKey, index, delta) {
                reorderList(listKey, index, index + delta);
            }

            function onSave() {
                saveSiteData(siteData);
                const t = new Date();
                setSavedAt(t.toLocaleString());
            }

            function resetToDefault() {
                setSiteData(DEFAULT_SITE_DATA);
                saveSiteData(DEFAULT_SITE_DATA);
                setSavedAt(new Date().toLocaleString());
            }

            if (!isLoggedIn) {
                return (
                    <div className="h-screen flex items-center justify-center">
                        <div className="bg-white p-12 rounded-[40px] shadow-2xl w-full max-w-sm text-center">
                            <h1 className="text-3xl font-black text-blue-900 mb-8">SECURE LOGIN</h1>
                            <input 
                                type="password" 
                                className="w-full p-4 bg-slate-50 border rounded-2xl mb-4 outline-none focus:border-blue-500" 
                                placeholder="Admin Password"
                                value={pass}
                                onChange={e => setPass(e.target.value)}
                            />
                            <button 
                                onClick={() => pass === 'admin123' ? setIsLoggedIn(true) : alert('Failed')}
                                className="w-full bg-blue-900 text-white py-4 rounded-2xl font-black hover:bg-blue-800 transition-all"
                            >
                                ACCESS PANEL
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex min-h-screen">
                    {/* Sidebar */}
                    <div className="w-64 bg-blue-950 text-white p-8">
                        <h2 className="text-xl font-black mb-10 border-b border-white/10 pb-4">CMS PANEL</h2>
                        <nav className="space-y-4">
                            {tabs.map(tab => (
                                <button 
                                    key={tab}
                                    onClick={() => setActiveTab(tab)}
                                    className={`w-full text-left p-3 rounded-xl font-bold capitalize transition-all ${activeTab === tab ? 'bg-blue-600 text-white' : 'text-blue-100/40 hover:text-white'}`}
                                >
                                    {tab}
                                </button>
                            ))}
                        </nav>
                        <div className="mt-10 space-y-3">
                            <button onClick={onSave} className="w-full bg-blue-600 hover:bg-blue-500 transition-all text-white font-black py-3 rounded-xl">SAVE ALL</button>
                            <button
                                type="button"
                                onClick={() => {
                                    downloadSiteDataJsonFile(siteData);
                                }}
                                className="w-full bg-emerald-700 hover:bg-emerald-600 transition-all text-white font-black py-3 rounded-xl text-sm"
                            >
                                Download {SITE_DATA_FILE}
                            </button>
                            <button
                                type="button"
                                disabled={serverPullBusy}
                                onClick={loadFromServerJsonFile}
                                className="w-full bg-slate-700 hover:bg-slate-600 disabled:opacity-50 transition-all text-white font-black py-3 rounded-xl text-sm"
                            >
                                {serverPullBusy ? 'Loading…' : `Load ${SITE_DATA_FILE} from server`}
                            </button>
                            <p className="text-[10px] text-white/50 font-semibold leading-snug px-1">
                                Save writes to this browser—the homepage on <span className="text-white/70">this device</span> reads the same storage. Download / import JSON to move data between computers or keep a backup. Use “Load from server” only if you host {SITE_DATA_FILE} and want to pull it into the editor.
                            </p>
                            <label className="block w-full">
                                <span className="sr-only">Import JSON</span>
                                <input
                                    ref={importJsonRef}
                                    type="file"
                                    accept="application/json,.json"
                                    className="hidden"
                                    onChange={(e) => {
                                        const f = e.target.files && e.target.files[0];
                                        e.target.value = '';
                                        if (!f) return;
                                        const reader = new FileReader();
                                        reader.onload = () => {
                                            const parsed = safeParse(reader.result);
                                            if (!parsed) {
                                                alert('Could not read JSON.');
                                                return;
                                            }
                                            const merged = applySiteDataMerge(DEFAULT_SITE_DATA, parsed);
                                            setSiteData(merged);
                                            saveSiteData(merged);
                                            setSavedAt(new Date().toLocaleString());
                                        };
                                        reader.onerror = () => alert('File read failed.');
                                        reader.readAsText(f);
                                    }}
                                />
                                <button
                                    type="button"
                                    onClick={() => importJsonRef.current && importJsonRef.current.click()}
                                    className="w-full border border-emerald-500/40 hover:bg-white/5 transition-all text-emerald-300 font-black py-3 rounded-xl text-sm"
                                >
                                    Import {SITE_DATA_FILE}
                                </button>
                            </label>
                            <button onClick={resetToDefault} className="w-full border border-white/20 hover:bg-white/5 transition-all text-white/80 font-black py-3 rounded-xl">RESET DEFAULT</button>
                            <button onClick={() => window.location.reload()} className="w-full text-red-400 font-bold text-sm pt-4">LOGOUT</button>
                            {savedAt ? <div className="text-[11px] text-white/50 font-bold pt-2">Saved: {savedAt}</div> : null}
                        </div>
                    </div>

                    {/* Content Area */}
                    <main className="flex-1 p-12">
                        <div className="max-w-4xl bg-white rounded-[40px] shadow-sm border border-slate-200 p-10">
                            <h1 className="text-3xl font-black text-blue-900 mb-8 uppercase tracking-widest">Edit {activeTab}</h1>
                            
                            {activeTab === 'info' && (
                                <div className="space-y-6">
                                    <Field label="Logo Title" value={siteData.info.logo_title} onChange={(v) => update(['info', 'logo_title'], v)} />
                                    <ImageField
                                        label="Logo image (navbar & favicon — URL or upload)"
                                        value={siteData.info.logo_image}
                                        onChange={(v) => update(['info', 'logo_image'], v)}
                                    />
                                    <Field label="Address" value={siteData.info.address} onChange={(v) => update(['info', 'address'], v)} />
                                    <Field label="Contact Email" value={siteData.info.email} onChange={(v) => update(['info', 'email'], v)} />
                                    <Field label="Phone" value={siteData.info.phone} onChange={(v) => update(['info', 'phone'], v)} />
                                    <button onClick={onSave} className="bg-blue-900 text-white px-8 py-4 rounded-2xl font-black">SAVE CHANGES</button>
                                </div>
                            )}

                            {activeTab === 'hero' && (
                                <div className="space-y-6">
                                    <Field label="Hero Title" value={siteData.hero.title} onChange={(v) => update(['hero', 'title'], v)} />
                                    <Field label="Hero Subtitle" value={siteData.hero.subtitle} onChange={(v) => update(['hero', 'subtitle'], v)} />
                                    <Field label="Hero Button Text" value={siteData.hero.cta_text} onChange={(v) => update(['hero', 'cta_text'], v)} />
                                    <Field label="Hero Background Video URL" value={siteData.hero.video} onChange={(v) => update(['hero', 'video'], v)} placeholder="https://..." />
                                    <button onClick={onSave} className="bg-blue-900 text-white px-8 py-4 rounded-2xl font-black">SAVE HERO</button>
                                </div>
                            )}

                            {activeTab === 'about' && (
                                <div className="space-y-6">
                                    <Field label="About Title" value={siteData.about.title} onChange={(v) => update(['about', 'title'], v)} />
                                    <ImageField label="About image (URL or upload)" value={siteData.about.image} onChange={(v) => update(['about', 'image'], v)} />
                                    <TextArea label="Main Content" value={siteData.about.content} onChange={(v) => update(['about', 'content'], v)} rows={8} />
                                    <button onClick={onSave} className="bg-blue-900 text-white px-8 py-4 rounded-2xl font-black">SAVE ABOUT</button>
                                </div>
                            )}

                            {['services', 'products', 'projects'].includes(activeTab) && (
                                <div className="space-y-6">
                                    <div className="flex items-center justify-between gap-4">
                                        <div className="text-sm font-black text-slate-500 uppercase tracking-widest">Manage {activeTab}</div>
                                        <button
                                            onClick={() => addListItem(activeTab)}
                                            className="bg-slate-900 text-white px-5 py-3 rounded-2xl font-black hover:bg-slate-800 transition-all"
                                        >
                                            + Add
                                        </button>
                                    </div>
                                    <p className="text-xs text-slate-500 font-semibold leading-relaxed">
                                        Click a <span className="font-black text-slate-700">title</span> to show or hide details. Use <span className="font-black text-slate-700">↑ ↓</span> to move one step (including to the top). Save when finished.
                                    </p>

                                    <div className="space-y-3">
                                        {(siteData[activeTab] || []).map((item, index) => {
                                            const listLen = (siteData[activeTab] || []).length;
                                            const isOpen = expandedItemId === item.id;
                                            const titleText = (item.title || '').trim();
                                            return (
                                                <div
                                                    key={item.id}
                                                    className={
                                                        'bg-slate-50 rounded-3xl border overflow-hidden transition-shadow ' +
                                                        (isOpen ? 'ring-2 ring-blue-200 shadow-md' : '')
                                                    }
                                                >
                                                    <div className="flex items-center gap-2 sm:gap-3 px-4 py-3">
                                                        <span className="text-[11px] font-black text-slate-400 w-7 shrink-0 tabular-nums">
                                                            {index + 1}
                                                        </span>
                                                        <button
                                                            type="button"
                                                            className="flex-1 text-left min-w-0 group"
                                                            onClick={() =>
                                                                setExpandedItemId((id) => (id === item.id ? null : item.id))
                                                            }
                                                        >
                                                            <span className="font-black text-blue-900 group-hover:underline decoration-2 underline-offset-2 block truncate">
                                                                {titleText || (
                                                                    <span className="text-slate-400 font-bold">(No title — click to add)</span>
                                                                )}
                                                            </span>
                                                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-tight">
                                                                {isOpen ? 'Hide details' : 'Show details'} · {item.id}
                                                            </span>
                                                        </button>
                                                        <div className="flex items-center gap-1 shrink-0">
                                                            <button
                                                                type="button"
                                                                title="Move up one"
                                                                disabled={index <= 0}
                                                                onClick={(e) => {
                                                                    e.stopPropagation();
                                                                    moveListItemOneStep(activeTab, index, -1);
                                                                }}
                                                                className="w-9 h-9 rounded-xl border-2 border-slate-200 bg-white font-black text-slate-700 hover:bg-slate-100 disabled:opacity-35 disabled:cursor-not-allowed disabled:hover:bg-white"
                                                            >
                                                                ↑
                                                            </button>
                                                            <button
                                                                type="button"
                                                                title="Move down one"
                                                                disabled={index >= listLen - 1}
                                                                onClick={(e) => {
                                                                    e.stopPropagation();
                                                                    moveListItemOneStep(activeTab, index, 1);
                                                                }}
                                                                className="w-9 h-9 rounded-xl border-2 border-slate-200 bg-white font-black text-slate-700 hover:bg-slate-100 disabled:opacity-35 disabled:cursor-not-allowed disabled:hover:bg-white"
                                                            >
                                                                ↓
                                                            </button>
                                                        </div>
                                                        <button
                                                            type="button"
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                if (expandedItemId === item.id) setExpandedItemId(null);
                                                                removeListItem(activeTab, item.id);
                                                            }}
                                                            className="text-red-600 font-black text-[10px] uppercase tracking-widest hover:underline shrink-0 px-2"
                                                        >
                                                            Remove
                                                        </button>
                                                    </div>

                                                    {isOpen ? (
                                                        <div className="px-4 pb-5 pt-1 border-t border-slate-200/80 bg-white/60 space-y-4">
                                                            <Field
                                                                label="Title"
                                                                value={item.title}
                                                                onChange={(v) => updateListItem(activeTab, item.id, { title: v })}
                                                            />
                                                            <ImageField
                                                                label="Image (URL or upload from computer)"
                                                                value={item.image}
                                                                onChange={(v) => updateListItem(activeTab, item.id, { image: v })}
                                                            />
                                                            <TextArea
                                                                label="Description"
                                                                value={item.desc}
                                                                onChange={(v) => updateListItem(activeTab, item.id, { desc: v })}
                                                                rows={4}
                                                            />
                                                            {activeTab === 'projects' ? (
                                                                <div className="grid md:grid-cols-2 gap-4">
                                                                    <Field
                                                                        label="Project Type"
                                                                        value={item.type}
                                                                        onChange={(v) => updateListItem(activeTab, item.id, { type: v })}
                                                                    />
                                                                    <Field
                                                                        label="Year"
                                                                        value={item.year}
                                                                        onChange={(v) => updateListItem(activeTab, item.id, { year: v })}
                                                                    />
                                                                </div>
                                                            ) : null}
                                                        </div>
                                                    ) : null}
                                                </div>
                                            );
                                        })}
                                    </div>

                                    <button onClick={onSave} className="bg-blue-900 text-white px-8 py-4 rounded-2xl font-black">SAVE {activeTab.toUpperCase()}</button>
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminPanel />);
    </script>
</body>
</html>
